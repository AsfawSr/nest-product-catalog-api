services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: nest_products_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Asfawpassword}
      POSTGRES_DB: ${DB_NAME:-nest_products}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-nest_products}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # NestJS API Backend Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest_products_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-Asfawpassword}
      DB_NAME: ${DB_NAME:-nest_products}
      DB_MIGRATIONS_RUN: "true"
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-development-key-change-in-production!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - app-network

  # Optional Web Database Management UI
  adminer:
    image: adminer:latest
    container_name: nest_products_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - app-network

volumes:
  pgdata:
    driver: local

networks:
  app-network:
    driver: bridge
